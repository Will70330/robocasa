# layout_messymem_002.yaml
#
# layout002 fixture arrangement rebuilt inside the layout_messymem_001 room shell.
# Room footprint is from layout_messymem_001 (7 m wide × 5 m deep vs layout002's
# 6.3 m × 5 m), so the left wall sits at X = 0 instead of X = -1.
#
# Transformations applied vs layout002:
#   X positions   : original_X + 1  (room-left shifts from -1 to 0)
#   Z positions   : × 0.65  (≈35% shorter throughout)
#   Z sizes       : × 0.65
#   stack_height  : × 0.65
#   Z offsets     : × 0.65
#   Y positions / X-Y sizes / normalized placement coords: unchanged
#   Island-local X/Y positions: unchanged (X shift absorbed by group_pos)
#
# Z key:  1.5→0.98  1.85→1.20  1.3→0.85  1.2→0.78  0.92→0.60  0.89→0.58
#         0.84→0.55  0.75→0.49  0.70→0.46  0.68→0.44  0.55→0.36  0.50→0.33
#         0.47→0.31  0.46→0.30  0.445→0.29  0.30→0.20  2.55→1.66  2.6→1.69

# walls, floor
room:
  walls:
    - name: wall
      type: wall

      size: [3.5, 0.98, 0.02]   # width unchanged; height 1.5×0.65=0.975≈0.98
      pos: [3.5, 0, 0.98]       # X/Y unchanged; Z 1.5×0.65=0.98

    - name: wall_backing
      type: wall

      backing: true
      backing_extended: [true, true]
      size: [3.5, 0.98, 0.1]
      pos: [3.5, 0, 0.98]

    - name: wall_left
      type: wall

      wall_side: left
      size: [2.5, 0.98, 0.02]
      pos: [0, -2.5, 0.98]

    - name: wall_left_backing
      type: wall

      backing: true
      wall_side: left
      size: [2.5, 0.98, 0.1]
      pos: [0, -2.5, 0.98]

    - name: wall_right
      type: wall

      wall_side: right
      size: [2.5, 0.98, 0.02]
      pos: [7, -2.5, 0.98]

    - name: wall_right_backing
      type: wall

      backing: true
      wall_side: right
      size: [2.5, 0.98, 0.1]
      pos: [7, -2.5, 0.98]

    - name: wall_front
      type: wall

      wall_side: front
      enclosing_wall: true
      size: [3.5, 0.98, 0.02]
      pos: [3.5, -5, 0.98]

    - name: wall_front_backing
      type: wall

      wall_side: front
      enclosing_wall: true
      backing: true
      backing_extended: [true, true]
      size: [3.5, 0.98, 0.1]
      pos: [3.5, -5, 0.98]

  floor:
    - name: floor
      type: floor

      # position such that the top left corner is (0, 0)
      size: [3.5, 2.5, 0.02]
      pos: [3.5, -2.5, 0]

    - name: floor_backing
      type: floor

      backing: true
      size: [3.5, 2.5, 0.1]
      pos: [3.5, -2.5, 0]

  # Wall accessories (e.g. outlets, clocks, paintings)
  wall_accessories:
    - name: outlet
      type: wall_accessory

      attach_to: wall
      pos: [4.8, null, 0.78]    # X: 3.8+1=4.8   Z: 1.2×0.65=0.78

    - name: outlet_2
      type: wall_accessory
      attach_to: wall

      pos: [3.0, null, 0.78]    # X: 2.0+1=3.0   Z: 0.78

    - name: light_switch
      type: wall_accessory
      config_name: light_switch

      attach_to: wall
      pos: [4.5, null, 0.78]    # X: 3.5+1=4.5   Z: 0.78

    - name: light_switch_2
      type: wall_accessory
      config_name: light_switch

      attach_to: wall
      pos: [4.6, null, 0.78]    # X: 3.6+1=4.6   Z: 0.78

    - name: utensil_rack
      type: utensil_rack

      attach_to: wall
      pos: [3.75, null, 0.85]   # X: 2.75+1=3.75  Z: 1.3×0.65=0.845≈0.85

  # floor_accessories:
  #   - name: stool_1
  #     type: stool
  #     attach_to: floor
  #     z_rot: 3.1415

  #     # place flush to ground
  #     pos: [3.1, -3.25, null]   # X: 2.1+1=3.1

  #   - name: stool_2
  #     type: stool
  #     attach_to: floor
  #     z_rot: 3.1415
  #     # enable: false
  #     # place flush to ground
  #     pos: [3.75, -3.25, null]  # X: 2.75+1=3.75

  #   - name: stool_3
  #     type: stool
  #     attach_to: floor
  #     z_rot: 3.1415
  #     # enable: false
  #     # place flush to ground
  #     pos: [4.4, -3.25, null]   # X: 3.4+1=4.4

# fixtures on the main wall
main_group:
  # Bottom row (counters and stoves)
  bottom_row:
    - name: stovetop
      type: stovetop

    - name: counter_main
      type: counter

      size: [3.8, 0.65, 0.60]       # height: 0.92×0.65=0.598≈0.60
      pos: [4.15, -0.325, 0.30]     # X: 3.15+1=4.15  Z: 0.46×0.65=0.299≈0.30

      interior_obj: stovetop
      obj_x_percent: 0.395
      obj_y_percent: 0.5

  wall_stack:
    - name: bottom
      type: stack
      levels: ["drawer", "drawer"]
      percentages: [0.5, 0.5]
      size: [0.8, 0.78, 0.33]       # height: 0.5×0.65=0.325≈0.33
      pos: [1.85, -0.39, 0.20]      # X: 0.85+1=1.85  Z: 0.30×0.65=0.195≈0.20

    - name: oven
      type: oven
      size: [0.75, 0.60, 0.44]      # height: 0.68×0.65=0.442≈0.44

    - name: oven_housing
      type: housing_cabinet
      size: [0.8, 0.78, 0.46]       # height: 0.70×0.65=0.455≈0.46
      padding: [null, [-0.01, null], null]
      align_to: bottom
      alignment: front
      side: top
      interior_obj: oven

    - name: microwave
      type: microwave
      size: [0.49, 0.33, null]       # scaled ×0.65: X 0.75→0.49, Y 0.50→0.33, Z null (natural)

    - name: micro_housing
      type: housing_cabinet
      size: [0.8, 0.78, 0.36]       # 0.55×0.65=0.3575≈0.36
      padding: [null, [-0.01, null], null]
      align_to: oven_housing
      alignment: front
      side: top
      interior_obj: microwave

    - name: top
      type: hinge_cabinet
      size: [0.8, 0.78, null]
      align_to: micro_housing
      alignment: front
      side: top
      stack_height: 1.66            # 2.55×0.65=1.6575≈1.66
      stack_fixtures: ["bottom", "oven_housing", "micro_housing"]

    - name: fridge
      type: fridge_side_by_side
      size: [0.55, 0.52, 1.14]      # scaled ×0.65: registry [0.85, 0.80, 1.75] → [0.55, 0.52, 1.14]

    - name: fridge_housing
      type: housing_cabinet
      padding: [[0.02, 0.02], [-0.04, 0.02], [0, 0.05]]
      align_to: micro_housing
      side: left
      alignment: top_back
      interior_obj: fridge

    - name: fridge_top
      type: hinge_cabinet
      size: [fridge_housing, fridge_housing, null]
      align_to: fridge_housing
      alignment: front
      side: top
      stack_height: 1.69            # fridge_housing≈1.19 → fridge_top.size[2] = 1.69−1.19 = 0.50m ✓
      stack_fixtures: ["fridge_housing"]

  # Top row (cabinets above counter)
  top_row:
    - name: cab_1
      type: hinge_cabinet
      default_config_name: cab_top

      size: [1, 0.40, 0.60]         # height: 0.92×0.65=0.598≈0.60
      pos: [2.75, -0.2, 1.20]       # X: 1.75+1=2.75  Z: 1.85×0.65=1.2025≈1.20

    - name: hood
      type: hood
      size: [stovetop, 0.6, null]
      offset: [0, 0, 0.49]          # Z: 0.75×0.65=0.4875≈0.49

      align_to: stovetop
      side: top
      alignment: back

    - name: shelves
      type: open_cabinet
      default_config_name: shelves

      size: [0.8, 0.4, 0.60]        # height: 0.92×0.65=0.598≈0.60
      align_to: cab_1
      side: right
      offset: [1, 0, 0]

    - name: cab_2
      type: hinge_cabinet
      default_config_name: cab_top

      size: [1, 0.40, 0.60]         # height: 0.92×0.65=0.598≈0.60
      align_to: shelves
      side: right

  # Cabinets built into counters
  bottom_row_cabinets:
    - name: stack_3
      type: stack
      levels: ["hinge_cabinet", ["drawer", "drawer"]]
      percentages: [0.75, 0.25]

      size: [1, 0.6, 0.55]          # height: 0.84×0.65=0.546≈0.55
      pos: [2.75, -0.3, 0.31]       # X: 1.75+1=2.75  Z: 0.47×0.65=0.3055≈0.31

    - name: stack_4
      type: stack
      levels: ["hinge_cabinet", ["drawer", "drawer"]]
      percentages: [0.75, 0.25]

      size: [1, 0.6, 0.55]
      align_to: stack_3
      side: right

    - name: stack_5
      type: stack
      levels: ["hinge_cabinet", ["drawer", "drawer"]]
      percentages: [0.75, 0.25]

      size: [1, 0.6, 0.55]
      align_to: stack_4
      side: right

    - name: stack_6
      type: stack
      levels: ["drawer", "drawer", "drawer", "drawer"]
      percentages: [0.25, 0.25, 0.25, 0.25]

      size: [0.8, 0.6, 0.55]
      align_to: stack_5
      side: right

  # Decorations on counters
  counter_accessories:
    - name: toaster
      type: toaster

      placement:
        fixture: counter_main_main_group
        sample_region_kwargs:
          ref: shelves
        size: [1.0, 0.40]
        pos: [null, 1.0]
        rotation: [0, 0]

    - name: electric_kettle
      type: electric_kettle
      enable: false

      placement:
        fixture: counter_main_main_group
        size: [0.80, 0.30]
        pos: [null, -0.75]
        rotation: [-1.0, 0.1]

    - name: toaster_oven
      type: toaster_oven
      enable: false

      placement:
        fixture: counter_main_main_group
        sample_region_kwargs:
          ref: cab_1
        size: [1.0, 0.45]
        pos: [null, 1.0]
        rotation: [0, 0]

    # - name: knife_block
    #   type: knife_block

    #   placement:
    #     fixture: counter_main_main_group
    #     sample_region_kwargs:
    #       ref: cab_1
    #     size: [1.0, obj]
    #     pos: [null, 1.0]
    #     rotation: [0, 0]

    # - name: paper_towel
    #   type: paper_towel

    #   placement:
    #     fixture: counter_main_main_group
    #     sample_region_kwargs:
    #       ref: shelves
    #     size: [1.0, obj]
    #     pos: [null, 1.0]
    #     rotation: [0, 0]

    # - name: coffee_machine
    #   type: coffee_machine

    #   placement:
    #     fixture: counter_main_main_group
    #     sample_region_kwargs:
    #       ref: cab_2
    #     size: [1.0, 0.52]
    #     pos: [null, 1.0]
    #     rotation: [0, 0]
    #     margin: 0.0

    - name: blender
      type: blender
      enable: false
      aux_fixture_config:
        has_free_joints: true
        placement: anchor
        auxiliary_placement_args:
          ensure_valid_placement: false

      placement:
        fixture: counter_main_main_group
        sample_region_kwargs:
          ref: stovetop
          loc: left
        size: [0.5, 0.25]
        pos: [1.0, -1.0]
        rotation: [0, 0]
        margin: 0.03

    - name: digital_scale
      type: digital_scale
      is_clutter: true

      placement:
        fixture: counter_main_main_group
        size: [1.0, 0.5]
        pos: [null, 1.0]
        rotation: [0, 0]
        margin: 0.03

    - name: oil_bottle
      type: oil_bottle
      is_clutter: true
      has_free_joints: true
      aux_fixture_config:
        is_clutter: true
        has_free_joints: true
        placement: anchor

      placement:
        fixture: counter_main_main_group
        sample_region_kwargs:
          ref: cab_2
        size: [1.0, 0.2]
        pos: [null, 0.8]
        rotation: [0, 0]

    - name: jar
      type: jar
      is_clutter: true
      aux_fixture_config:
        is_clutter: true
        placement: anchor
        auxiliary_placement_args:
          ensure_valid_placement: false

      placement:
        fixture: shelves_main_group
        size: [0.5, 0.3]
        pos: [-1.0, 0]
        rotation: [0, 0]

    - name: paprika
      type: paprika
      is_clutter: true

      placement:
        fixture: shelves_main_group
        size: [0.5, obj]
        pos: [1.0, 0]
        rotation: [0, 0]

    - name: cinnamon
      type: cinnamon
      is_clutter: true

      placement:
        fixture: shelves_main_group
        size: [0.5, obj]
        pos: [0.75, 0]
        rotation: [0, 0]

    - name: turmeric
      type: turmeric
      is_clutter: true

      placement:
        fixture: shelves_main_group
        size: [0.5, obj]
        pos: [0.5, 0]
        rotation: [0, 0]


island_group:
  group_origin: [0, 0]
  group_pos: [3.75, -1.65]     # X: 2.75+1=3.75  Y unchanged
  group_z_rot: 3.1415

  island:
    - name: sink
      type: sink

    - name: island
      type: counter
      default_config_name: island
      interior_obj: sink

      size: [2.75, 1.4, 0.60]       # height: 0.92×0.65=0.598≈0.60
      pos: [0, 1.0, 0.30]           # local frame X/Y unchanged  Z: 0.46×0.65=0.299≈0.30
      obj_x_percent: 0.5
      obj_y_percent: 0.01

  island_bottom_row:
    - name: island_stack_1
      type: stack
      levels: ["hinge_cabinet", "panel_cabinet"]
      percentages: [0.75, 0.25]

      size: [1, 0.60, 0.55]         # height: 0.84×0.65=0.546≈0.55
      pos: [0, 0.63, 0.31]          # Z: 0.47×0.65=0.3055≈0.31

      configs:
        hinge_cabinet:
          open_top: true

    - name: dishwasher
      type: dishwasher

      size: [0.65, 0.6, 0.58]       # height: 0.89×0.65=0.5785≈0.58
      align_to: island_stack_1
      side: right
      alignment: top_back

    - name: island_panel_cab_right
      type: stack

      levels: ["panel_cabinet"]
      percentages: [1]

      configs:
        panel_cabinet:
          solid_body: true
          panel_type: "slab"

      size: [0.2, 1.35, 0.55]       # height: 0.84×0.65=0.546≈0.55
      pos: [1.25, 1.0, 0.31]        # Z: 0.47×0.65=0.31

    - name: island_cab_left
      type: stack

      levels: ["drawer", "drawer", "drawer", "drawer"]
      percentages: [0.25, 0.25, 0.25, 0.25]

      size: [0.65, 0.6, 0.55]       # height: 0.84×0.65=0.55
      align_to: island_stack_1
      side: left

    - name: island_panel_cab_left
      type: stack

      levels: ["panel_cabinet"]
      percentages: [1]

      configs:
        panel_cabinet:
          solid_body: true
          panel_type: "slab"

      size: [0.2, 1.35, 0.55]
      pos: [-1.25, 1.0, 0.31]

    - name: island_base_box
      type: box

      size: [2.35, 0.1, 0.58]       # height: 0.89×0.65=0.5785≈0.58
      pos: [0, 1.2, 0.29]           # Z: 0.445×0.65=0.289≈0.29

  island_accessories:
    - name: dish_rack
      type: dish_rack
      enable: false

      placement:
        fixture: island_island_group
        sample_region_kwargs:
          ref: sink
          loc: left_right
        size: [obj, 0.50]
        pos: ["ref", -0.8]
        rotation: [0, 0]

    - name: stand_mixer
      type: stand_mixer
      enable: false

      placement:
        fixture: island_island_group
        sample_region_kwargs:
          ref: sink
          loc: left_right
        size: [1.0, 0.25]
        pos: [null, -1.0]
        rotation: [-1.57, -1.57]
        offset: [0, 0.01]

    # - name: plant
    #   type: plant

    #   placement:
    #     fixture: island_island_group
    #     sample_region_kwargs:
    #       ref: stool_2
    #     size: [0.5, 0.4]
    #     pos: [0, -1.0]
    #     rotation: [0, 0]

    - name: soap_dispenser
      type: soap_dispenser
      is_clutter: true
      has_free_joints: true

      placement:
        fixture: island_island_group
        sample_region_kwargs:
          ref: sink
          loc: left_right
        size: [0.15, 0.15]
        pos: ["ref", -0.3]
        rotation: [-3.14, 3.14]

