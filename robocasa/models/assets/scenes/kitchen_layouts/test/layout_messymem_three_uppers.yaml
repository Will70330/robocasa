# layout_messymem_three_uppers.yaml
#
# Three-upper-cabinet variant of layout_messymem_uppers_only.yaml. The
# original (ID 66) has two upper hinge cabinets (cab_1, cab_2) flanking
# an open `shelves` fixture; this layout replaces the shelves with a
# third hinge cabinet (cab_2 middle) and renames the original far-right
# cabinet to cab_3, so the linear ordering left → right is:
#
#   cab_1  (x=1.75) — far-left upper hinge cabinet
#   cab_2  (x=3.15) — middle upper hinge cabinet (slightly narrower)
#   cab_3  (x=4.55) — far-right upper hinge cabinet
#
# Geometry is otherwise identical to layout 66 — same walls / floor /
# counter / stools — so perception sweeps and robot navigation
# distances carry over unchanged.
#
# Motivation: enables 3-cabinet memory-chain tests where one cabinet
# can be locked, one cabinet's contents observed in a first task, and
# a separate cabinet's contents discovered in a follow-up. With only
# 2 cabinets and one locked, the planner is forced by elimination to
# retry the locked cabinet for anything not in the inspected one.

room:
  walls:
    - name: wall
      type: wall
      size: [3.15, 1.5, 0.02]
      pos: [2.15, 0, 1.5]

    - name: wall_backing
      type: wall
      backing: true
      backing_extended: [true, true]
      size: [3.15, 1.5, 0.1]
      pos: [2.15, 0, 1.5]

    - name: wall_left
      type: wall
      wall_side: left
      size: [2.5, 1.5, 0.02]
      pos: [-1, -2.5, 1.5]

    - name: wall_left_backing
      type: wall
      backing: true
      wall_side: left
      size: [2.5, 1.5, 0.1]
      pos: [-1, -2.5, 1.5]

    - name: wall_right
      type: wall
      wall_side: right
      size: [2.5, 1.5, 0.02]
      pos: [5.3, -2.5, 1.5]

    - name: wall_right_backing
      type: wall
      backing: true
      wall_side: right
      size: [2.5, 1.5, 0.1]
      pos: [5.3, -2.5, 1.5]

    - name: wall_front
      type: wall
      wall_side: front
      enclosing_wall: true
      size: [3.15, 1.5, 0.02]
      pos: [2.15, -5.0, 1.5]

    - name: wall_front_backing
      type: wall
      wall_side: front
      enclosing_wall: true
      backing: true
      backing_extended: [true, true]
      size: [3.15, 1.5, 0.1]
      pos: [2.15, -5.0, 1.5]

  floor:
    - name: floor
      type: floor
      size: [3.15, 2.5, 0.02]
      pos: [2.15, -2.5, 0]

    - name: floor_backing
      type: floor
      backing: true
      size: [3.15, 2.5, 0.1]
      pos: [2.15, -2.5, 0]

  wall_accessories:
    - name: outlet
      type: wall_accessory
      attach_to: wall
      pos: [3.8, null, 1.2]

    - name: outlet_2
      type: wall_accessory
      attach_to: wall
      pos: [2, null, 1.2]

    - name: light_switch
      type: wall_accessory
      config_name: light_switch
      attach_to: wall
      pos: [3.5, null, 1.2]

    - name: light_switch_2
      type: wall_accessory
      config_name: light_switch
      attach_to: wall
      pos: [3.6, null, 1.2]

    - name: utensil_rack
      type: utensil_rack
      attach_to: wall
      pos: [2.75, null, 1.3]

  # Stools removed: their floor footprint at y=-3.25 was blocking the
  # mobile base when it tried to navigate east-west between cabinets
  # during chained tasks. No task in this layout interacts with them.

main_group:
  bottom_row:
    - name: counter_main
      type: counter
      size: [5.0, 0.65, 0.92]
      pos: [3.0, -0.325, 0.46]

  top_row:
    # cab_1 — far-left upper hinge cabinet.
    - name: cab_1
      type: hinge_cabinet
      default_config_name: cab_top
      size: [1.0, 0.40, 0.92]
      pos: [1.75, -0.2, 1.85]

    # cab_2 — middle upper hinge cabinet. Slightly narrower than
    # cab_1/cab_3 (0.8m vs 1.0m) to preserve the original layout-66
    # spacing — the middle slot used to be filled by an 0.8m-wide
    # `shelves` open_cabinet, and shifting the right cabinet would
    # require recomputing perception sweep waypoints and OpenCabinet
    # spawn poses everywhere.
    - name: cab_2
      type: hinge_cabinet
      default_config_name: cab_top
      size: [0.8, 0.40, 0.92]
      pos: [3.15, -0.2, 1.85]

    # cab_3 — far-right upper hinge cabinet (was cab_2 in layout 66).
    - name: cab_3
      type: hinge_cabinet
      default_config_name: cab_top
      size: [1.0, 0.40, 0.92]
      pos: [4.55, -0.2, 1.85]
